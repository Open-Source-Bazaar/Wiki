packages:
  - .
autoInstallPeers: false
minimumReleaseAge: 0
overrides:
  next: $next
patchedDependencies:
  next@16.3.0: patches/next@16.3.0.patch
allowBuilds:
  '@sentry/cli': true
  core-js: true
  less: true
  sharp: true
  unrs-resolver: true
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
